[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-agents"
version = "0.1.0"
description = "Search algorithms (BFS, IDDFS, uniform-cost, greedy, A*) with grid path finding and the 8-puzzle, including heuristic comparison."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nima Azami" }]
dependencies = []
keywords = ["artificial-intelligence", "a-star", "search-algorithms", "8-puzzle"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
